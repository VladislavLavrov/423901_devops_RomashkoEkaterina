services:
  mariadb:
    container_name: web-mariadb-13
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: 13_Calculator
      MARIADB_USER: root
      MARIADB_PASSWORD: password
    ports:
      - "0.0.0.0:5044:3306"

  web:
    container_name: 13_calculator
    hostname: app
    build: .
    ports:
      - "0.0.0.0:5013:5013"
